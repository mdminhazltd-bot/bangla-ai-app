<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলা AI চ্যাট</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7016644127018456"
     crossorigin="anonymous"></script>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-mark">
                <svg viewBox="0 0 24 24" fill="none"><path d="M12 3c-4 0-7 2.7-7 6.2 0 2.1 1.1 4 2.9 5.1L7 20l4.3-2.1c.2 0 .5 0 .7 0 4 0 7-2.7 7-6.2S16 3 12 3z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
            </div>
            <h1>বাংলা AI</h1>
            <p>আপনার প্রশ্নের উত্তর দিতে প্রস্তুত</p>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot-message">
                <div class="bubble">
                    আসসালামু আলাইকুম! আমি আপনার বাংলা AI অ্যাসিস্ট্যান্ট। যেকোনো প্রশ্ন জিজ্ঞেস করতে পারেন। 😊
                </div>
            </div>
        </div>

        <div class="typing-indicator hidden" id="typingIndicator">
            AI লিখছে...
        </div>

        <form class="chat-input-area" id="chatForm">
            <input
                type="text"
                id="userInput"
                placeholder="এখানে আপনার প্রশ্ন লিখুন..."
                autocomplete="off"
                required
            >
            <button type="submit" id="sendBtn">পাঠান</button>
        </form>

        <div class="footnote">🔒 আপনার তথ্য সম্পূর্ণ নিরাপদ এবং গোপন রাখা হবে</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
